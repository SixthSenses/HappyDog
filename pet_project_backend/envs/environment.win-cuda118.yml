name: happydog-win-cuda118
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  # CUDA 11.8 stack for Windows
  - pytorch=2.5
  - torchvision=0.20
  - torchaudio=2.5
  - pytorch-cuda=11.8
  # Core backend
  - flask=3.1
  - flask-jwt-extended=4.7
  - pyyaml
  - requests
  - numpy=1.26
  - pandas=2.3
  - pillow
  - psutil
  - tqdm
  - marshmallow=4.0
  - pip:
      - google-auth-oauthlib==1.2.2
      - opencv-python==4.10.0.84
      - firebase-admin==7.0.0
      - google-cloud-firestore==2.21.0
      - google-cloud-storage==3.2.0
      - openai==1.100.2
      - jiter==0.10.0
      - filetype==1.2.0
      - fire==0.7.0
      - ultralytics==8.3.172
      - timm==1.0.19
      - yolov5==7.0.14
      - sahi==0.11.31
      - shapely==2.1.1
      - scipy==1.11.4
      - faiss-gpu-cu11==1.7.2
